name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Build and pack
        run: |
          dotnet restore src\dotNet.Templates
          dotnet pack src\dotNet.Templates -c Release -o ./artifacts /p:PushAfterBuild=false

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/') && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path ./artifacts -Filter "*.nupkg" | Select-Object -First 1
          if (-not $pkg) { Write-Error "No package found"; exit 1 }
          dotnet nuget push $pkg.FullName -k $env:NUGET_API_KEY -s https://api.nuget.org/v3/index.json
